/* Zgrada · direction « troc » : arrondie, chaleureuse. Tout se passe sur le téléphone (localStorage). */
:root {

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Figtree", "Inter", system-ui, -apple-system, sans-serif; }
body { min-height: 100vh; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }
.scr { padding: calc(14px + env(safe-area-inset-top)) 18px 170px; display: flex; flex-direction: column; gap: 14px; min-height: 100vh; }
.scr.plain { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
.top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; gap: 10px; }
.ibtn { width: 44px; height: 44px; border-radius: 50%; background: var(--card); border: 0; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 14px rgba(30, 43, 58, .07); flex-shrink: 0; }
.ibtn.on { color: #E0446A; }
.h1 { font-size: 29px; font-weight: 800; letter-spacing: -.025em; line-height: 1.08; margin: 0; }
.h2 { font-size: 19px; font-weight: 800; letter-spacing: -.015em; margin: 0; }
.ttl { font-size: 16px; font-weight: 800; }
.sub { font-size: 15px; color: var(--ink-2); line-height: 1.4; margin: 0; }
.small { font-size: 13px; color: var(--ink-3); line-height: 1.35; }
.b { font-weight: 800; }
.card { background: var(--card); border-radius: 26px; padding: 16px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 10px; }
.wrap { display: flex; flex-wrap: wrap; gap: 8px; }
.grow { flex: 1; min-width: 0; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 10px 15px; font-size: 15px; font-weight: 700; background: var(--card); border: 2px solid var(--line); white-space: nowrap; }

.chip.sm { padding: 8px 13px; font-size: 14px; }

.btn.y { background: var(--yellow); color: var(--ink); }
.btn.ghost { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 2px var(--line); }
.btn.sm { min-height: 44px; font-size: 15px; width: auto; }
.btn:disabled { opacity: .45; }
.tile { border-radius: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
.tile img { width: 100%; height: 100%; object-fit: cover; }
.av { border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }

.hero { margin: calc(-14px - env(safe-area-inset-top)) -18px 0; height: 290px; border-radius: 0 0 40px 40px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.hero img { width: 100%; height: 100%; object-fit: cover; }

.bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; }
.crit { display: flex; align-items: center; gap: 10px; font-size: 14.5px; }
.crit.no { color: #9AA4AF; text-decoration: line-through; }
.empty { text-align: center; padding: 30px 10px; color: var(--ink-3); font-size: 15px; }
a { color: inherit; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
.fcard { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: 24px; padding: 12px; box-shadow: var(--shadow); border: 0; width: 100%; text-align: left; }
.fcard .ft { font-size: 16px; font-weight: 800; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.want { display: flex; align-items: center; gap: 6px; border-radius: 12px; padding: 6px 10px; font-size: 13px; font-weight: 700; max-width: 100%; min-width: 0; }
.want span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.price { font-size: 13px; font-weight: 800; color: var(--ink); white-space: nowrap; }
.tab span { white-space: nowrap; }
/* Visite guidée */
.dim { position: fixed; inset: 0; background: rgba(20, 28, 38, .55); z-index: 30; }
.tourcard { position: fixed; left: 50%; transform: translateX(-50%); width: calc(min(480px, 100vw) - 32px); bottom: 104px; background: var(--card); border-radius: 28px; padding: 20px; z-index: 41; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 16px 40px rgba(0, 0, 0, .25); }
.tourcard:after { content: ""; position: absolute; bottom: -9px; left: var(--ax, 50%); width: 20px; height: 20px; background: var(--card); transform: translateX(-50%) rotate(45deg); border-radius: 4px; }
.tabbar.lift { z-index: 40; }
.tab.hl, .fab.hl, .asst.hl { box-shadow: 0 0 0 4px var(--yellow); border-radius: 18px; color: #fff; }
.fab.hl { border-radius: 50%; box-shadow: 0 0 0 5px #fff; }
/* Assistant */
.asst { position: fixed; right: max(16px, calc(50vw - 224px)); bottom: 98px; z-index: 21; width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--card); box-shadow: 0 8px 24px rgba(30, 43, 58, .2); display: flex; align-items: center; justify-content: center; padding: 0; }
.asst:after { content: ""; position: absolute; right: 3px; top: 3px; width: 11px; height: 11px; border-radius: 50%; background: #2EBD7F; border: 2px solid #fff; }
.asst.hl { z-index: 41; border-radius: 50%; box-shadow: 0 0 0 5px var(--yellow); }
.ans { align-self: flex-start; background: var(--card); border-radius: 22px 22px 22px 6px; padding: 14px; box-shadow: 0 4px 14px rgba(30, 43, 58, .06); display: flex; flex-direction: column; gap: 8px; max-width: 92%; font-size: 15px; line-height: 1.4; }
.ans ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; }
.ans .t { font-weight: 800; font-size: 16px; }
</style>

  if (L.length > 40) L.splice(0, L.length - 40);
  save(); render(); setTimeout(function () { window.scrollTo(0, document.body.scrollHeight); }, 30);
}
/* Visite guidée des onglets */
var TOUR = [
  ["explorer", "compass", "mint", "Explorer", "Les échanges près de chez vous : logements, objets et coups de main. « Pour vous » met en avant ce qui correspond à vos envies."],
  ["etapes", "cal", "lav", "Étapes", "Votre déménagement en version légère : ce qu’il faut faire, et quand. Cochez au fur et à mesure."],
  ["fab", "plus", "butter", "Le bouton +", "Publiez ce que vous avez : un meuble, un coup de main, votre appartement. Dites ce que vous voulez en échange."],
  ["messages", "chat", "sky", "Messages", "Vos propositions et rendez-vous. Quand vous dites oui, chacun met 2 crédits en gage ; 1 revient une fois l’échange fait."],
  ["moi", "user", "peach", "Moi", "Vos annonces, vos crédits, votre code pour inviter un ami et les réglages."],
  ["asst", "spark", "butter", "Zora, votre assistante", "Une question sur l’app, un bail à résilier, une caution à récupérer ? Touchez la petite maison, elle vous répond."]
];
function tourHtml() {
  var i = S.tour, st = TOUR[i], ax = { explorer: "12%", etapes: "31%", fab: "50%", messages: "69%", moi: "88%", asst: "88%" }[st[0]];
  return '<div class="dim" data-act="tourNext"></div><div class="tourcard" style="--ax:' + ax + ";" + (st[0] === "asst" ? "bottom:172px" : "") + '"><div class="row">' + (st[0] === "asst" ? '<div class="av" style="width:52px;height:52px;background:var(--butter)">' + mascot(42) + "</div>" : tile(st[1], st[2], 52)) + '<div class="grow"><div class="small b">' + (i + 1) + " sur " + TOUR.length + '</div><b style="font-size:19px;letter-spacing:-.01em">' + st[3] + '</b></div></div><p class="sub" style="margin:0">' + st[4] + '</p><div class="row"><button class="btn ghost sm" style="flex:1" data-act="tourEnd">Passer</button><button class="btn y sm" style="flex:1.4" data-act="tourNext">' + (i === TOUR.length - 1 ? "C’est parti" : "Suivant") + "</button></div></div>";
}

/* ---------- Routeur ---------- */
function view() {
  if (S.step < 3) return vOnboard();
  var c = cur();
  if (c) {
    if (c.v === "offer") return vOffer(c.p);
    if (c.v === "compose") return vCompose(c.p);
    if (c.v === "thread") return vThread(c.p);
    if (c.v === "deal") return vDeal(c.p);
    if (c.v === "publish") return vPublish();
    if (c.v === "credits") return vCredits();
    if (c.v === "assist") return vAssist();
    if (c.v === "devis") return vDevis(c.p);
  }
  return { explorer: vExplorer, etapes: vEtapes, messages: vMessages, moi: vMoi }[S.tab]();
}
function render() {
  var f = document.activeElement, fid = f && (f.id || f.getAttribute("data-bind")), pos = f && f.selectionStart;
  try { app.innerHTML = view() + (S.step >= 3 && S.tour >= 0 && !cur() ? tourHtml() : "") + (T.toast ? '<div class="toast" role="status">' + esc(T.toast) + "</div>" : ""); }
  catch (e) { console.error(e); app.innerHTML = '<div class="scr plain"><h1 class="h1">Oups, un écran n’a pas pu s’afficher.</h1><p class="sub">' + esc(e.message) + '</p><button class="btn y" data-act="recover">Revenir à l’accueil</button></div>'; }
  if (fid) { var el = document.getElementById(fid) || app.querySelector('[data-bind="' + fid + '"]'); if (el && el.type !== "date" && el.tagName !== "SELECT") { el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (e) {} } }
}

/* ---------- Simulation des profils d’exemple ---------- */
function nextSlot(days) { var d = addDays(today(), days); d.setHours(19, 0, 0, 0); return d.getTime(); }
function replyLater(c, msg, card, ms) {
  T.typing[c.id] = true; render();
  setTimeout(function () {
    T.typing[c.id] = false;
    c.msgs.push({ t: msg, me: false, ts: Date.now() }); if (card) c.msgs.push({ card: card, me: false, ts: Date.now() });
    c.ts = Date.now(); var top = cur(); if (!(top && top.v === "thread" && top.p.id === c.id)) c.unread = (c.unread || 0) + 1;
    save(); render();
  }, ms || 1600);
}

/* ---------- Actions ---------- */
var A = {
  step: function (n) { S.step = +n; save(); render(); window.scrollTo(0, 0); },
  skip: function () { S.step = 3; S.tour = 0; save(); render(); },
  tour: function () { S.stack = []; S.tab = "explorer"; S.tour = 0; save(); render(); window.scrollTo(0, 0); },
  tourNext: function () { S.tour += 1; if (S.tour >= TOUR.length) { S.tour = -1; S.tab = "explorer"; } else { var k = TOUR[S.tour][0]; if (["explorer", "etapes", "messages", "moi"].indexOf(k) >= 0) S.tab = k; } save(); render(); window.scrollTo(0, 0); },
  tourEnd: function () { S.tour = -1; S.tab = "explorer"; save(); render(); },
  assist: function () { go("assist"); setTimeout(function () { window.scrollTo(0, document.body.scrollHeight); }, 30); },
  ask: function (id) { var t = KB.filter(function (x) { return x.id === id; })[0]; S.assist = S.assist || []; S.assist.push({ me: true, t: t.q }); S.assist.push({ topic: id }); save(); render(); setTimeout(function () { window.scrollTo(0, document.body.scrollHeight); }, 30); },
  clearAsk: function () { S.assist = []; save(); render(); },
  toggle: function (a) { var p = a.split("|"), L = S.me[p[0]], i = L.indexOf(p[1]); if (i >= 0) L.splice(i, 1); else L.push(p[1]); save(); render(); },
  dog: function () { S.me.dog = !S.me.dog; save(); render(); },
  finish: function () { S.me.rooms = +S.me.rooms || 0; S.me.budget = parseInt(String(S.me.budget).replace(/\D/g, ""), 10) || 0; S.step = 3; S.tab = "explorer"; S.stack = []; S.filter = forYou().length ? "pour" : "tout"; if (S.tour == null || S.tour === -2) S.tour = 0; save(); render(); window.scrollTo(0, 0); },
  tab: tab, back: back,
  recover: function () { S.stack = []; S.tab = "explorer"; save(); render(); },
  filter: function (f) { S.filter = f; save(); render(); },
  filterGo: function (f) { S.filter = f; tab("explorer"); },
  search: function () { T.search = !T.search; if (!T.search) S.q = ""; render(); },
  open: function (id) { go("offer", { id: id }); },
  fav: function (id) { var i = S.favs.indexOf(id); if (i >= 0) S.favs.splice(i, 1); else { S.favs.push(id); toast("Gardé dans votre profil"); } save(); render(); },
  compose: function (id) { T.draft = null; go("compose", { id: id }); },
  give: function (h) { var it = HAVE.filter(function (x) { return x[0] === h; })[0] || [h, "box"]; T.draft.give.push({ t: h, s: "De ma liste", k: it[1], c: h === "Mon appartement" ? "sky" : it[1] === "hand" ? "lav" : "butter", w: h === "Mon appartement" ? 6 : it[1] === "box" ? 1 : 2 }); render(); },
  giveText: function () { var t = prompt("Que proposez-vous ?"); if (t && t.trim()) { T.draft.give.push({ t: t.trim().slice(0, 60), s: "Proposé par vous", k: "spark", c: "butter", w: 2 }); render(); } },
  ungive: function (i) { T.draft.give.splice(+i, 1); render(); },
  addcredit: function () { if (S.credits < 2) return toast("Il vous faut 2 crédits"); T.draft.credits = 2; render(); },
  nocredit: function () { T.draft.credits = 0; render(); },
  send: function () {
    var d = T.draft, o = offer(d.offer), give = d.give.map(function (g) { return g.t; }); if (d.credits) give.push(d.credits + " crédits");
    var c = { id: "c" + Date.now(), offer: o.id, with: o.owner, col: o.ocol, demo: !!o.demo, give: give, status: "open", ts: Date.now(), msgs: [] };
    c.msgs.push({ t: (d.note && d.note.trim()) || "Bonjour ! Votre annonce « " + o.title + " » m’intéresse. Je vous propose : " + give.join(", ") + ".", me: true, ts: Date.now() });
    S.convs.push(c); T.draft = null; S.stack = []; S.tab = "messages"; save(); go("thread", { id: c.id });
    if (c.demo) replyLater(c, "Bonjour ! Ça me va très bien. On se voit quand ?", { when: nextSlot(3), where: o.where }, 1800);
  },
  chatOnly: function (id) {
    var o = offer(id), c = { id: "c" + Date.now(), offer: o.id, with: o.owner, col: o.ocol, demo: !!o.demo, give: [], status: "chat", ts: Date.now(), msgs: [] };
    S.convs.push(c); save(); go("thread", { id: c.id });
  },
  thread: function (id) { var c = conv(id); if (c) { c.unread = 0; } go("thread", { id: id }); },
  accept: function (id) {
    var c = conv(id), card = c.msgs.filter(function (m) { return m.card; }).pop().card;
    if (S.credits < 2) return toast("Il vous faut 2 crédits pour la mise. Rechargez dans Moi.");
    S.credits -= 2; S.ledger.push({ t: "Mise · " + (offer(c.offer) || {}).title, n: -2, ts: Date.now() });
    c.status = "deal"; c.when = card.when; c.where = card.where; c.msgs.push({ t: "C’est noté, à " + JOURS[new Date(card.when).getDay()] + " !", me: true, ts: Date.now() });
    save(); S.stack.pop(); go("deal", { id: id });
  },
  otherDay: function (id) { var c = conv(id); c.msgs.push({ t: "Un autre jour, ça vous irait ?", me: true, ts: Date.now() }); save(); render(); if (c.demo) replyLater(c, "Pas de souci, et celui-ci ?", { when: nextSlot(5 + Math.floor(Math.random() * 3)), where: (offer(c.offer) || {}).where || "" }, 1500); },
  done: function (id) { var c = conv(id); c.status = "done"; S.credits += 1; S.deals += 1; S.ledger.push({ t: "Rendu · échange réalisé", n: 1, ts: Date.now() }); var o = offer(c.offer); if (o && o.kind !== "aide") o.gone = true; save(); toast("Bravo ! 1 crédit vous revient"); },
  quick: function (a) { var p = a.split("|"); sendMsg(p[0], p.slice(1).join("|").replace(/&#8239;/g, " ")); },
  publish: function () { T.pub = null; go("publish"); },
  pkind: function (k) { T.pub.kind = k; T.pub.wants = k === "logement" ? "Mon appartement en échange" : "Un coup de main (2 h)"; render(); },
  pwants: function (w) { T.pub.wants = w === "__other" ? "" : w; render(); },
  pdogs: function () { T.pub.dogs = !T.pub.dogs; render(); },
  doPublish: function () {
    var d = T.pub, wants = d.wants || d.wantsOther.trim();
    if (!d.title.trim()) return toast("Ajoutez un titre");
    if (!wants) return toast("Dites ce que vous voulez en échange");
    if (d.kind === "logement" && !(parseInt(d.rent, 10) > 0)) return toast("Indiquez le loyer");
    var o = { id: "m" + Date.now(), kind: d.kind, title: d.title.trim(), where: d.where.trim() || S.me.zone || "Près de chez vous", km: 0, wants: wants, owner: S.me.name || "Vous", ocol: "sky", mine: true, desc: d.desc.trim(), photo: d.photo, created: Date.now() };
    if (d.kind === "logement") { o.rooms = +d.rooms; o.rent = parseInt(String(d.rent).replace(/\D/g, ""), 10); o.free = d.free || iso(today()); o.dogs = d.dogs; }
    S.offers.unshift(o); T.pub = null; S.stack = []; var bonus = !S.bonusPub; if (bonus) { S.bonusPub = true; S.credits += 2; S.ledger.push({ t: "Première annonce", n: 2, ts: Date.now() }); } save(); toast(bonus ? "Annonce publiée · +2 crédits" : "Annonce publiée"); go("offer", { id: o.id });
  },
  remove: function (id) { if (!confirm("Retirer cette annonce ?")) return; offer(id).gone = true; S.stack = []; S.tab = "moi"; save(); render(); },
  task: function (k) { S.tasks[k] = !S.tasks[k]; save(); render(); },
  credits: function () { go("credits"); },
  devis: function (svc) { T.devis = null; go("devis", { svc: svc }); },
  dsvc: function (k) { T.devis.svc = k; T.devis.ok = false; render(); },
  dok: function () { T.devis.ok = !T.devis.ok; render(); },
  dsend: function () { var d = T.devis; if (!d.ok) return; S.quotes = (S.quotes || []).filter(function (q) { return q.svc !== d.svc; }); S.quotes.push({ svc: d.svc, rooms: d.rooms, date: d.date, from: d.from, to: d.to, note: d.note, ts: Date.now() }); save(); toast("Demande prête"); render(); },
  dcancel: function (k) { S.quotes = (S.quotes || []).filter(function (q) { return q.svc !== k; }); T.devis.ok = false; save(); render(); },
  ref: function () { var v = (document.getElementById("ref").value || "").trim().toUpperCase(); if (!/^[A-Z0-9]{6}$/.test(v)) return toast("Le code fait 6 lettres ou chiffres"); if (v === S.code) return toast("C’est votre propre code"); S.refUsed = true; S.credits += 3; S.ledger.push({ t: "Code d’un ami", n: 3, ts: Date.now() }); save(); toast("+3 crédits"); },
  copy: function () { var t = "Rejoins-moi sur Zgrada pour échanger meubles, coups de main et logements. Mon code : " + S.code + " (3 crédits offerts)"; try { navigator.clipboard.writeText(t).then(function () { toast("Copié, à coller dans un message"); }, function () { toast("Votre code : " + S.code); }); } catch (e) { toast("Votre code : " + S.code); } },
  editProfile: function () { S.step = 1; S.stack = []; save(); render(); window.scrollTo(0, 0); },
  reset: function () { if (!confirm("Tout effacer sur ce téléphone ?")) return; S = fresh(); save(); render(); }
};
function sendMsg(id, t) {
  var c = conv(id); if (!t || !t.trim()) return;
  c.msgs.push({ t: t.trim(), me: true, ts: Date.now() }); c.ts = Date.now(); save(); render(); window.scrollTo(0, document.body.scrollHeight);
  if (c.demo && c.status !== "done") {

    else replyLater(c, ["Parfait 🙂", "Super, merci !", "Ça marche !"][c.msgs.length % 3], null, 1300);

}

/* ---------- Événements ---------- */
app.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  var fn = A[b.getAttribute("data-act")]; if (fn) { e.preventDefault(); fn(b.getAttribute("data-arg")); }
});
app.addEventListener("input", function (e) {
  var k = e.target.getAttribute("data-bind"); if (!k) return;
  var v = e.target.value;
  if (k === "_note") { T.draft.note = v; return; }
  if (k.indexOf("_pub.") === 0) { T.pub[k.slice(5)] = v; return; }
  if (k.indexOf("_devis.") === 0) { T.devis[k.slice(7)] = v; return; }
  if (k === "q") { S.q = v; save(); render(); return; }
  var p = k.split("."); if (p[0] === "me") S.me[p[1]] = v; save();
  if (e.target.type === "date" && S.step >= 3) render();
});
app.addEventListener("change", function (e) {
  if (e.target.matches("[data-photo]")) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var img = new Image(), r = new FileReader();
    r.onload = function () { img.onload = function () { var s = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); T.pub.photo = c.toDataURL("image/jpeg", .72); render(); }; img.src = r.result; };
    r.readAsDataURL(f);
  } else if (e.target.tagName === "SELECT") { var k = e.target.getAttribute("data-bind"); if (k && k.indexOf("_devis.") === 0) T.devis[k.slice(7)] = e.target.value; else if (k && k.indexOf("_pub.") === 0) T.pub[k.slice(5)] = e.target.value; else if (k) { S.me[k.split(".")[1]] = e.target.value; save(); } }
});
app.addEventListener("submit", function (e) {
  var f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault();
  if (f.getAttribute("data-form") === "ask") { var qi = f.querySelector("input"), qq = qi.value; qi.value = ""; return askText(qq); }
  var i = f.querySelector("input"), t = i.value; i.value = ""; sendMsg(f.getAttribute("data-arg"), t);
});
window.addEventListener("popstate", function () { if (cur()) { S.stack.pop(); save(); render(); } });
render();
